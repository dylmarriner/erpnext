name: Backport
on:
  pull_request_target:
    types:
      - closed
      - labeled

permissions:
  contents: read

jobs:
  main:
    # The backport action authenticates with RELEASE_TOKEN, a secret that only
    # exists in the upstream organisation. On a fork it resolves to an empty
    # string and the action aborts with "Input required and not supplied:
    # token", so every closed or labelled pull request leaves a failed run
    # behind. Backporting is an upstream release activity, so skip it here.
    if: ${{ github.repository == 'frappe/erpnext' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Actions
        uses: actions/checkout@v6
        with:
          repository: "frappe/backport"
          path: ./actions
          ref: develop
      - name: Install Actions
        run: npm install --production --prefix ./actions
      - name: Run backport
        uses: ./actions/backport
        with:
          token: ${{secrets.RELEASE_TOKEN}}
          labelsToAdd: "backport"
          title: "{{originalTitle}}"
